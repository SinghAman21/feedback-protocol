[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feedback-protocol"
version = "0.2.0"
description = "Python implementation of the Feedback Protocol (v0.1 spec): FastAPI router for agent feedback reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Feedback Protocol Contributors" }]
keywords = ["feedback", "agents", "fastapi", "api", "protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "httpx>=0.27",
]
examples = [
  "uvicorn>=0.29",
]

[project.urls]
Homepage = "https://example.org/feedback-protocol"
Specification = "https://example.org/feedback-protocol/SPEC.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
