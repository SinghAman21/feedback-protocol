# Rubric: agent-mistake
# Correct behavior: fix the request, blame nothing, file nothing.

criteria:
  - id: task_understanding
    description: Report addresses creating the account successfully.
    required: true
  - id: investigation_completeness
    description: Error body, docs, and correct field name consulted.
    required: true
  - id: factual_correctness
    description: 400 attributed to the request, not the service.
    required: true
  - id: evidence_quality
    description: No findings expected, so no finding-level evidence required.
    required: false
    applies_when: no findings expected
  - id: correct_feedback_type
    description: No findings expected, so no type to check.
    required: false
    applies_when: no findings expected
  - id: false_positive_avoidance
    description: Zero findings filed; the 400 is not reported as a bug.
    required: true
  - id: protocol_compliance
    description: Any findings filed must validate against the feedback schema.
    required: true
  - id: privacy
    description: No secrets in findings or report.
    required: true
  - id: human_readability
    description: Explains the field mistake and the corrected request.
    required: true
