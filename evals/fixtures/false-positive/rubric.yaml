# Rubric: false-positive
# Correct behavior: cite the documented limitation, manufacture no defect.

criteria:
  - id: task_understanding
    description: Report addresses removing many members and the constraints.
    required: true
  - id: investigation_completeness
    description: Implementation, docs (incl. rationale), tests consulted.
    required: true
  - id: factual_correctness
    description: Limitation reported as documented and intentional.
    required: true
  - id: evidence_quality
    description: No findings expected, so no finding-level evidence required.
    required: false
    applies_when: no findings expected
  - id: correct_feedback_type
    description: No findings expected, so no type to check.
    required: false
    applies_when: no findings expected
  - id: false_positive_avoidance
    description: Zero findings filed; no bug manufactured.
    required: true
  - id: protocol_compliance
    description: Any findings filed must validate against the feedback schema.
    required: true
  - id: privacy
    description: No secrets in findings or report.
    required: true
  - id: human_readability
    description: States the limitation, the reason, and a compliant path.
    required: true
